<style>

header{text-align:center;padding:28px 16px 8px}

h1{font:700 clamp(30px,6vw,48px) Amiri;margin:6px 0 0}
.sub{color:var(--soft);font-size:15px;margin:0}
.sub.author{color:var(--ink);font-weight:700;font-size:16px;margin-top:4px}

nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 10px;max-width:820px;margin:auto}

p{margin:6px 0}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}

#explain-footer {

<script>
const V=[
["التوابع أربعة: النعت، والعطف، والتوكيد، والبدل",
"التوابع هي ألفاظ تتبع ما قبلها (المتبوع) في الإعراب رفعاً ونصباً وجراً. وأول التوابع هو النعت (الصفة)، وهو تابع يوضح متبوعه (المنعوت) إن كان معرفة، ويخصصه إن كان نكرة.<br><b>المعنى النحوي:</b> المنعوت يُعرب بحسب موقعه في الجملة، والنعت يتبعه في الحركات والوظيفة النحوية.",
[["النعت","الصفة التي تتبع المنعوت","جمعها: نعوت"],["التوابع","ألفاظ تتبع ما قبلها في الإعراب","مفردها: تابع"],["المنعوت","الموصوف الذي يسبق النعت","جمعها: منعوتون / منعوتات"]],
"أعرب: ﴿وَفِي الْأَرْضِ قِطَعٌ مُتَجَاوِرَاتٌ﴾",
"قطع: مبتدأ مؤخر مرفوع وعلامة رفعه الضمة الظاهرة. متجاورات: نعت (صفة) مرفوع وعلامة رفعه الضمة الظاهرة."],
["النعت المفرد: ما ليس جملة ولا شبه جملة",
"النعت المفرد هو ما كان كلمة واحدة تفيد الصفة، ولا تعني نقيض المثنى أو الجمع؛ بل يأتي مفردًا أو مثنى أو جمعاً مطابِقاً لمنعوته.<br><b>أمثلة الرزمة:</b> ﴿جَنَّاتٍ لَّهُمْ فِيهَا نَعِيمٌ مُّقِيمٌ﴾ (مقيم: نعت مفرد مرفوع)، ﴿السَّحَابَ الرِّقَالَ﴾ (الرقال: نعت مفرد منصوب)، ﴿خَلْقٍ جَدِيدٍ﴾ (جديد: نعت مفرد مجرور).",
[["مفرد","ما ليس جملة ولا شبه جملة","مفرد × جملة"],["الرقال","السحاب العظيم الثقيل","جمع ثقيلة"],["مقيم","دائم ثابت","مقيم × زائل"]],
"أعرب: ﴿لَفِي خَلْقٍ جَدِيدٍ﴾",
"في: حرف جر. خلق: اسم مجرور وعلامة جره الكسرة. جديد: نعت مجرور وعلامة جره الكسرة الظاهرة."],
["النعت الجملة وشبه الجملة (الجمل بعد النكرات صفات)",
"يجيء النعت جملة فعلية أو جملة اسمية أو شبه جملة (ظرف أو جار ومجرور). والشرط الأساسي لنعت الجملة أن يكون المنعوت <b>نكرة</b>، وأن تشتمل الجملة على ضمير رابط يعود على المنعوت.<br><b>قاعدة ذهبية:</b> الجمل بعد النكرات صفات، وبعد المعارف أحوال.",
[["الجملة الفعلية","ما تكونت من فعل وفاعل في محل نعت","—"],["الجملة الاسمية","ما تكونت من مبتدأ وخبر تشتمل على ضمير","—"],["شبه الجملة","الجار والمجرور أو الظرف","—"]],
"أعرب جملة النعت في: ﴿لِّقَوْمٍ يَتَفَكَّرُونَ﴾",
"يتفكرون: فعل مضارع مرفوع بثبوت النون، والواو ضمير متصل في محل رفع فاعل. والجملة الفعلية (يتفكرون) في محل جر نعت لـ (قوم)."],
["النعت السببي: يصف شيئاً من لوازم المنعوت",
"النعت السببي يتبع ما قبله في الإعراب والتحديد (التعريف والتنكير)، ويتبع ما بعده في التذكير والتأنيث، ويكون دائماً مفرداً.<br><b>مثال الرزمة:</b> «لَنا عَدُوٌّ شَدِيدٌ مَكْرُهُ»؛ كلمة (شديد) تصف مكر العدو لا ذات العدو نفسها، ولذا يُسمى نعتاً سببياً.",
[["النعت السببي","يصف شيئاً متعلقاً بالمنعوت","—"],["مكره","مكر: فاعل لاسم الفاعل أو الصفة المشبهة","—"]],
"أعرب: ﴿لَنَا عَدُوٌّ شَدِيدٌ مَكْرُهُ﴾",
"عدو: مبتدأ مؤخر مرفوع وعلامة رفعه الضمة. شديد: نعت سببي مرفوع وعلامة رفعه الضمة. مكره: فاعل لشديد مرفوع وهو مضاف والهاء مضاف إليه."],
["حل التدريب الأول: تحديد النعت والمنعوت في الآيات الكريمة",
"1. ﴿وَقَالَ رَجُلٌ مُّؤْمِنٌ... يَكْتُمُ إِيمَانَهُ﴾ ➔ المنعوت (رجل)، النعت المفرد (مؤمن)، والنعت الجملة (يكتم إيمانه).<br>2. ﴿رِجَالٌ صَدَقُوا﴾ ➔ المنعوت (رجال)، النعت جملة فعلية (صدقوا).<br>3. ﴿رَجُلٌ يَسْعَى﴾ ➔ المنعوت (رجل)، النعت جملة فعلية (يسعى).<br>4. ﴿وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ﴾ ➔ المنعوت (جنة)، النعت جملة اسمية (عرضها السماوات).<br>5. ﴿وَكُلُّ شَيْءٍ عِندَهُ بِمِقْدَارٍ﴾ ➔ المنعوت (شيء)، النعت شبه جملة (عنده).",
[["صدقوا","جملة فعلية في محل رفع نعت","—"],["عرضها السماوات","جملة اسمية في محل جر نعت","—"]],
"أعرب: ﴿رَجُلٌ يَسْعَى﴾",
"رجل: فاعل مرفوع وعلامة رفعه الضمة. يسعى: فعل مضارع مرفوع بالضمة المقدرة، والجملة الفعلية (يسعى) في محل رفع نعت لـ (رجل)."],
["حل التدريب الثاني والثالث: المطابقة والتمثيل بالجمل",
"<b>التدريب الثاني (المطابقة):</b><br>1. يُحشر التاجران <b>الصادقان</b> مع الأنبياء.<br>2. يُحشر التجار <b>الصادقون</b> مع الأنبياء.<br>3. تُحشر التاجرة <b>الصادقة</b> مع الأنبياء.<br>4. تُحشر التاجرتان <b>الصادقتان</b> مع الأنبياء.<br>5. تُحشر التاجرات <b>الصادقات</b> مع الأنبياء.<br><b>التدريب الثالث (التمثيل):</b><br>• نعت جملة فعلية: رأيت طالباً <b>يجتهد في دروسه</b>.<br>• نعت جملة اسمية: زرت حديقة <b>أزهارها جميلة</b>.<br>• نعت شبه جملة: شاهدت عصفوراً <b>على الغصن</b>.<br>• نعت مفرد: قرأت كتاباً <b>نافعاً</b>.",
[["الصادقان","نعت مرفوع بالياء لأنه مثنى","—"],["أزهارها جميلة","مبتدأ وخبر في محل نصب نعت","—"]],
"أعرب: «رَأَيْتُ طَالِباً يَجْتَهِدُ»",
"طالباً: مفعول به منصوب وعلامة نصبه الفتحة. يجتهد: فعل مضارع والفاعل مستتر، والجملة الفعلية في محل نصب نعت."],
["حل التدريب الرابع: الفروق الإعرابية بين الجمل المتقابلة",
"1. <b>الطالبُ النشيطُ محبوبٌ</b> ➔ (النشيطُ): نعت مرفوع وعلامة رفعه الضمة.<br><b>الطالبُ نشيطٌ</b> ➔ (نشيطٌ): خبر المبتدأ مرفوع وعلامة رفعه الضمة.<br><i>التعليل:</i> في الأولى الكلمة معرفة كمنعوتها فتكون نعتاً، وفي الثانية تمّ بها المعنى مع المبتدأ المعرفة فتكون خبراً.<br>2. <b>جاءَ رجلٌ يسألُ عن عطاءٍ</b> ➔ جملة (يسألُ) في محل رفع نعت لـ (رجل) لأن المنعوت نكرة.<br><b>جاءَ الرجلُ يسألُ عن عطاءٍ</b> ➔ جملة (يسألُ) في محل نصب حال من (الرجل) لأن المنعوت معرفة.",
[["النشيط","نعت معرفة يتبع المعرفة","—"],["يسأل (بعد نكرة)","جملة في محل رفع نعت","—"],["يسأل (بعد معرفة)","جملة في محل نصب حال","—"]],
"أعرب جملة (يسأل) في: «جَاءَ الرَّجُلُ يَسْأَلُ»",
"يسأل: فعل مضارع والفاعل ضمير مستتر تقديره هو، والجملة الفعلية في محل نصب حال من (الرجل)."],
["حل ورقة العمل الشاملة في درس النعت والنعت السببي",
"<b>س1: إعراب ما تحته خط:</b><br>• هذا رجلٌ ابنه محبوبٌ ➔ (ابنه محبوب): جملة اسمية في محل رفع نعت لـ (رجل).<br>• هذا رجلٌ محبوبٌ ابنه ➔ (محبوب): نعت سببي مرفوع، (ابنه): فاعل لاسم المفعول/الصفة المشبهة مرفوع.<br><b>س2: موقع الجملة الاسمية:</b><br>• هذا عالمٌ علمه غزيرٌ ➔ جملة (علمه غزير) في محل رفع نعت.<br>• هذا العالمُ علمه غزيرٌ ➔ جملة (علمه غزير) في محل رفع خبر المبتدأ (هذا) أو خبر ثانٍ.<br><b>س4: تصويب الأخطاء النحوية:</b><br>• في السوق بضاعةٌ جميلةً ➔ التصحيح: <b>جميلةٌ</b> (نعت مرفوع لمبتدأ مؤخر).<br>• كتبتُ بقلمٍ أزرقاً ➔ التصحيح: <b>أزرقَ</b> (نعت مجرور بالفتحة لأنه ممنوع من الصرف).",
[["علمه غزير","مبتدأ وخبر تشتمل على ضمير رابط","—"],["أزرق","صفة على وزن أفعل ممنوعة من الصرف","تجر بالفتحة"]],
"أعرب: «هَذَا رَجُلٌ مَحْبُوبٌ ابْنُهُ»",
"هذا: اسم إشارة مبتدأ. رجل: خبر مرفوع بالضمة. محبوب: نعت سببي مرفوع بالضمة. ابنه: نائب فاعل لاسم المفعول (محبوب) مرفوع بالضمة."]

const $=s=>document.querySelector(s);let cur=0,pg=0,all=false;
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const T=["١ التفسير والشرح","٢ المفردات والمعاني","٣ الإعراب والتحليل"];

function ayah(i){
    const text = V[i][0];
    if (text.includes("﴿")) {
        return `<div class="ayah">${text} <small>(${ar(i+1)})</small></div>`;
    }
    return `<div class="title-box">${text} <small>(${ar(i+1)})</small></div>`;
}

function head(i,p,t){return `<h2>${t}</h2><div class="pn">الدرس الأساسي — الصفحة ${ar(p+1)} من ٣</div>`+ayah(i)}

function page(i,p){const v=V[i];let h=`<section class="page">`+head(i,p,["الشرح النحوي والتطبيقي","المفردات والمفاهيم","الإعراب والتطبيق الأكاديمي"][p]);
if(p==0){h+=`<h3>التوضيح والشرح المفصل</h3><p>${v[1]}</p><h3>القواعد والفوائد التربوية</h3><p>النعت تابع يكمل متبوعه، والمحافظة على سلامة التركيب النحوي يمنح اللسان والبيان قوة وفصاحة.</p>`}
if(p==1){h+=`<h3>المفردات والمصطلحات النحوية</h3><table><tr><th>المصطلح / الكلمة</th><th>الشرح النحوي والتفصيلي</th><th>الجمع / المضاد / التوضيح</th></tr>${v[2].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`}
if(p==2){h+=`<h3>السؤال الإعرابي للتطبيق</h3><div class="q"><b>${v[3]}</b><br><button data-a>أظهر الإجابة النموذجية</button><div class="ans"><b>الإجابة والإعراب:</b> ${v[4]}</div></div>`}
return h+`</section>`}

function render(){
document.querySelectorAll('#nav button').forEach((b,i)=>b.setAttribute('aria-current',i==cur));

        const docEl = document.documentElement;
        const explainFooter = $('#explain-footer');
        
        if (!document.fullscreenElement) {
            if (docEl.requestFullscreen) docEl.requestFullscreen();
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
            explainFooter.classList.add('active');
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            explainFooter.classList.remove('active');
        }

'<div class="bkbar"><div class="bkt" id="bkt"></div><div class="bkacts">'+
 '<button class="bkb" id="bkdrill" aria-pressed="false">وضع التدريب</button>'+
 '<button class="bkb" id="bkclose">إغلاق</button></div></div>'+
'<div class="bkstage" id="bkstage">'+
 '<button class="bkarr bkprev" id="bkprev" aria-label="الصفحة السابقة">'+CH.r+'</button>'+
 '<div class="bk" id="bk"></div>'+
 '<button class="bkarr bknext" id="bknext" aria-label="الصفحة التالية">'+CH.l+'</button></div>'+
'<div class="bkfoot"><button class="bkb" id="bkp">'+CH.r+'<span>السابق</span></button>'+
 '<div class="bkmid"><select class="bksel" id="bksel" aria-label="الانتقال إلى بند"></select><span class="bkinfo" id="bkinfo" aria-live="polite"></span></div>'+
 '<button class="bkb" id="bkn"><span>التالي</span>'+CH.l+'</button></div>';
document.body.appendChild(ov);
const $o=s=>ov.querySelector(s);
const bk=$o('#bk'),stage=$o('#bkstage'),sel=$o('#bksel'),info=$o('#bkinfo');
const prevBs=[$o('#bkprev'),$o('#bkp')],nextBs=[$o('#bknext'),$o('#bkn')];
sel.innerHTML='<option value="c">الغلاف</option>'+V.map((_,i)=>`<option value="${i}">بند ${ar(i+1)}</option>`).join('');

let spread=true,built=null,N=14,maxPos=14,pos=0,pw=0,ph=0,leaves=[];
let busy=0,tm=0,rt=0,lastFocus=null,closing=false;
const bgEls=()=>[...document.body.children].filter(e=>e!==ov);

function coverHTML(){
 const t=q('h1').textContent.trim();
 const subs=[...document.querySelectorAll('header .sub')].map(e=>e.textContent.trim());
 return `<div class="cvf">${ORN}<div class="ct">${esc(t)}</div><div class="cl"></div>${subs.map((s,i)=>`<div class="cs${i?'':' c1'}">${esc(s)}</div>`).join('')}</div>`;
}
const backHTML=()=>`<div class="cvf">${ORN}</div>`;
const blankHTML=()=>`<div class="frm"></div>${ORN}`;
function pageFace(pi){
 return `<div class="pb" tabindex="0">${page(Math.floor(pi/3),pi%3)}</div><div class="fd"></div><div class="hn">${CH.d}</div><div class="fo">${ar(pi+1)}</div>`;
}
function spec(face){
 if(face===0)return['cv',coverHTML()];
 if(face===1||face===26)return['bl',blankHTML()];
 if(face===27)return['cv',backHTML()];
 return['pgf',pageFace(face-2)];
}
function build(key){
 built=key;spread=key==='sp';
 N=spread?14:26;maxPos=spread?N:N-1;pos=0;
 bk.className='bk '+key;
 let h='<div class="stk l"></div>'+(spread?'<div class="stk r"></div>':'');
 for(let k=0;k<N;k++){
  let a,b;
  if(spread){a=spec(2*k);b=spec(2*k+1)}
  else{a=k===0?['cv',coverHTML()]:k===N-1?['cv',backHTML()]:['pgf',pageFace(k-1)];b=['bp','']}
  h+=`<div class="lf" style="z-index:${N-k+1}"><div class="fc fr ${a[0]}">${a[1]}</div><div class="fc bc ${b[0]}">${b[1]}</div></div>`;
 }
 bk.innerHTML=h;
 leaves=[...bk.querySelectorAll('.lf')];
 bindContent();
}
function bindContent(){
 bind();
 bk.querySelectorAll('td+td').forEach(td=>td.onclick=()=>td.classList.toggle('on'));
 bk.querySelectorAll('.pb').forEach(pb=>pb.addEventListener('scroll',()=>more(pb),{passive:true}));
}
function more(pb){pb.parentElement.classList.toggle('more',pb.scrollHeight-pb.scrollTop-pb.clientHeight>8)}
function updateMore(){bk.querySelectorAll('.pb').forEach(more)}

function measure(){
 const r=stage.getBoundingClientRect();
 const side=r.width>=900?66:8;
 const aw=Math.max(240,r.width-2*side),ah=Math.max(260,r.height-14);
 spread=aw>=820&&ah>=420;
 let w,h=ah;
 if(spread){w=aw/2;if(w/h>.8)w=h*.8;else if(w/h<.62)h=w/.62}
 else w=Math.min(aw,Math.max(h*.8,Math.min(aw,520)));
 pw=Math.floor(w);ph=Math.floor(h);
}
function layout(force,pi0){
 measure();
 bk.style.setProperty('--pw',pw+'px');bk.style.setProperty('--ph',ph+'px');
 const key=spread?'sp':'one';
 if(force||key!==built){
  const pi=pi0!==undefined?pi0:piOf();
  build(key);
  go(posOf(pi),false);
 }else settle();
}

function piOf(){
 if(pos<=0)return -1;
 if(spread){const r=2*pos-3;return r>=0?Math.min(r,NP-1):0}
 return Math.min(pos-1,NP-1);
}
function posOf(pi){
 if(pi<0)return 0;
 return spread?(pi%2===0?pi/2+1:(pi+3)/2):pi+1;
}
const zRest=k=>k<pos?k+1:N-k+1;
function win(p,set){for(let k=p-2;k<=p+2;k++)if(k>=0&&k<N)set.add(k);return set}

function go(np,animate){
 np=Math.max(0,Math.min(maxPos,np));
 const old=pos;
 if(np!==old){
  pos=np;
  const fwd=np>old,lo=Math.min(old,np),hi=Math.max(old,np),ks=[];
  for(let k=lo;k<hi;k++)ks.push(k);
  if(!fwd)ks.reverse();
  const m=ks.length;
  const A=(animate&&!REDUCE.matches)?Math.min(m,MAXA):0;
  const stag=A>1?Math.min(130,950/(A-1)):0;
  const want=new Set();win(old,want);win(np,want);
  ks.forEach((k,i)=>{if(i>=m-A)want.add(k)});
  leaves.forEach((l,k)=>{l.style.display=want.has(k)?'':'none'});
  void bk.offsetWidth;
  ks.forEach((k,i)=>{
   const l=leaves[k],j=i-(m-A),an=j>=0;
   l.style.setProperty('--ft',an?DUR+'s':'0s');
   l.style.setProperty('--dl',an?(j*stag/1000).toFixed(3)+'s':'0s');
   l.style.zIndex=an?200+(fwd?k:N-k):zRest(k);
   l.classList.toggle('fl',k<np);
   if(an){l.classList.remove('fly');void l.offsetWidth;l.classList.add('fly')}
  });
  if(A)busy=Math.max(busy,performance.now()+(DUR+(A-1)*stag/1000)*1000+80);
 }
 settle();
 clearTimeout(tm);
 tm=setTimeout(cleanup,Math.max(0,busy-performance.now())+30);
}
function cleanup(){
 if(performance.now()<busy-20){tm=setTimeout(cleanup,busy-performance.now()+30);return}
 leaves.forEach((l,k)=>{l.style.zIndex=zRest(k);l.classList.remove('fly')});
 const want=win(pos,new Set());
 leaves.forEach((l,k)=>{l.style.display=want.has(k)?'':'none'});
 updateMore();
}
function settle(){
 let sx=0;
 if(spread){if(pos===0)sx=pw/2;else if(pos===N)sx=-pw/2}
 bk.style.transform=sx?`translateX(${sx}px)`:'';
 bk.style.setProperty('--tl',((spread?(N-pos)/N:(maxPos-pos)/maxPos)*(spread?13:8)).toFixed(1)+'px');
 bk.style.setProperty('--tr',(spread?pos/N*13:0).toFixed(1)+'px');
 prevBs.forEach(b=>b.disabled=pos<=0);
 nextBs.forEach(b=>b.disabled=pos>=maxPos);
 const pi=piOf();
 if(pi>=0){cur=Math.floor(pi/3);pg=pi%3;seen.add(cur)}
 sel.value=pos===0?'c':String(cur);
 let t;
 if(pos===0)t='الغلاف';
 else if(pos>=N&&spread||!spread&&pos===maxPos)t='نهاية الكتاب';
 else if(spread){
  const nr=2*pos-2,nl=2*pos-1,ok=[nr,nl].filter(n=>n>=1&&n<=NP);
  t=ok.length===2?`الصفحتان ${ar(ok[0])} – ${ar(ok[1])} من ${ar(NP)}`:`الصفحة ${ar(ok[0])} من ${ar(NP)}`;
 }else t=`الصفحة ${ar(pos)} من ${ar(NP)}`;
 info.textContent=t;
 const vis=new Set();
 if(spread){
  if(leaves[pos-1])vis.add(leaves[pos-1].querySelector('.bc'));
  if(leaves[pos])vis.add(leaves[pos].querySelector('.fr'));
 }else if(leaves[pos])vis.add(leaves[pos].querySelector('.fr'));
 bk.querySelectorAll('.fc').forEach(f=>{f.inert=!vis.has(f)});
}
const next=()=>go(pos+1,true),prev=()=>go(pos-1,true);

function openBook(){
 if(!ov.hidden||closing)return;
 lastFocus=document.activeElement;
 ov.hidden=false;ov.classList.remove('out');
 document.body.classList.add('bkopen');
 bgEls().forEach(e=>e.inert=true);
 $o('#bkt').textContent=q('h1').textContent.trim();
 $o('#bkdrill').setAttribute('aria-pressed',document.body.classList.contains('drill'));
 layout(true,(cur===0&&pg===0)?-1:cur*3+pg);
 $o('#bkclose').focus();
}
function closeBook(){
 if(ov.hidden||closing)return;
 closing=true;ov.classList.add('out');
 setTimeout(()=>{
  ov.hidden=true;ov.classList.remove('out');
  document.body.classList.remove('bkopen');
  bgEls().forEach(e=>e.inert=false);
  closing=false;
  render();
  try{lastFocus&&lastFocus.focus()}catch(_){}
 },230);
}

q('#bkb').onclick=openBook;
$o('#bkclose').onclick=closeBook;
prevBs.forEach(b=>b.onclick=prev);
nextBs.forEach(b=>b.onclick=next);
sel.onchange=()=>go(sel.value==='c'?0:posOf(+sel.value*3),true);
$o('#bkdrill').onclick=e=>{q('#drill').click();e.currentTarget.setAttribute('aria-pressed',document.body.classList.contains('drill'))};

addEventListener('keydown',e=>{
 if(ov.hidden)return;
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeBook();return}
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const k=e.key;
 if(k==='ArrowLeft'||k==='ArrowRight'){
  e.stopImmediatePropagation();
  if(e.target&&e.target.tagName==='SELECT')return;
  e.preventDefault();
  k==='ArrowLeft'?next():prev();
 }else if((k==='Home'||k==='End')&&!(e.target&&e.target.closest&&e.target.closest('.pb'))){
  e.preventDefault();go(k==='Home'?0:maxPos,true);
 }
},true);

let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
stage.addEventListener('touchend',e=>{
 if(!tx)return;
 const t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y;tx=null;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6)dx>0?next():prev();
},{passive:true});

const onResize=()=>{if(ov.hidden)return;clearTimeout(rt);rt=setTimeout(()=>layout(false),120)};
addEventListener('resize',onResize);addEventListener('orientationchange',onResize);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!ov.hidden)updateMore()});
})();
</script>
</body>
</html>
